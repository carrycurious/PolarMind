[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polarmind"
version = "0.1.0"
description = "Multilingual polarization detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "transformers>=4.44",
    "datasets",
    "scikit-learn",
    "tqdm",
    "accelerate",
    "peft",
    "trl",
    "bitsandbytes; platform_system != 'Windows'",
]

[project.optional-dependencies]
logging = ["wandb"]

[project.scripts]
polarmind = "polarmind.cli.main:main"

[tool.setuptools.packages.find]
include = ["polarmind*"]
